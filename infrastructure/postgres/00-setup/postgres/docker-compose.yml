services:

  postgres:

    image: postgres:15

    container_name: report-postgres

    hostname: report-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Uni1234
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../../sql/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql

    networks:
      streaming-network:
        aliases:
          - report-postgres

networks:

  streaming-network:
    external: true

volumes:
  postgres_data: