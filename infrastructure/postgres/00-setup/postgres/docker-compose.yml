services:

  postgres:

    image: postgres:16.3

    container_name: postgres

    hostname: postgres

    networks:
      - streaming-network

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: UnigapPostgres@123
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      # AUTO RUN DDL
      - ../../../../sql/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql

  adminer:

    image: adminer:4.8.1

    container_name: adminer

    hostname: adminer

    networks:
      - streaming-network

    ports:
      - "8380:8080"

networks:

  streaming-network:
    external: true

volumes:

  postgres_data:
    driver: local